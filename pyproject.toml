[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conflictwatch"
version = "0.6.0"
description = "Open-source conflict monitoring & situational awareness — ingest ACLED/GDELT/UCDP + OSINT feeds, analyze hotspots/trends, and a sourced 'what's working' lessons KB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-COCL-1.0" }
authors = [{ name = "Cognis Digital LLC" }]
keywords = ["osint", "conflict", "acled", "gdelt", "ucdp", "situational-awareness",
            "monitoring", "force-protection", "counter-uas", "uas", "fpv", "ew",
            "electronic-warfare", "geoint", "sigint", "imint", "isr", "scraping", "rss",
            "satellite", "adsb", "ais", "sdr", "early-warning", "humanitarian", "displacement",
            "ukraine", "mena", "sahel", "indo-pacific", "think-tank", "stix", "threat-intel",
            "security", "intelligence", "tccc", "pnt", "gps-jamming", "counter-uas", "c-uas", "anti-drone", "fiber-optic-drone", "acoustic-detection", "shahed", "interceptor-drone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cognis-digital/conflictwatch"

[project.scripts]
conflictwatch = "conflictwatch.cli:main"
conflictwatch-emit = "conflictwatch.connect:emit_main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["conflictwatch"]
artifacts = ["conflictwatch/data/*.json", "conflictwatch/data_feeds_2026.json"]
